# Perfil ativado em nuvem via SPRING_PROFILES_ACTIVE=cloud (App Settings do Azure
# Web App). Troca o H2 em arquivo pelo MySQL do Azure Database for MySQL Flexible
# Server, provisionado pelo script da Sprint 4 (ver docs/azure/provisionar.sh).
#
# DATABASE_URL (obrigatoria em nuvem), exemplo:
#   jdbc:mysql://<servidor>.mysql.database.azure.com:3306/ollipet?useSSL=true&requireSSL=true&serverTimezone=UTC

spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Console do H2 nao faz sentido (nem existe) fora do perfil local.
spring.h2.console.enabled=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
