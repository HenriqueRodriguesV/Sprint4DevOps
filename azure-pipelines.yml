# =============================================================================
# Pipeline CI/CD - Olli Pet API - Sprint 4 (DevOps Tools & Cloud Computing)
# =============================================================================
#
#   push na master ->  CI (Build): mvn clean package = compila + testes JUnit
#                                 + publica resultados dos testes
#                                 + publica o artefato (.jar)
#                 ->  CD (Deploy): dispara sozinho quando o artefato existe,
#                                  aplica as App Settings do banco e faz o
#                                  deploy do .jar no Azure Web App (Linux, Java 21)
#
# Nada e manual: o unico gatilho e o push na branch master.
# =============================================================================

# Regra II: o CI dispara a cada alteracao na branch master.
trigger:
  branches:
    include:
      - master

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Credenciais do banco (DATABASE_URL, DATASOURCE_USERNAME, DATASOURCE_PASSWORD)
  # ficam SOMENTE no Variable Group "ollipet-cloud" (Pipelines > Library),
  # marcadas com o cadeado (secret). Nunca aparecem no codigo nem nos logs.
  - group: ollipet-cloud

  # Valores NAO sensiveis, fixos aqui porque o Azure DevOps precisa conhecer o
  # nome da Service Connection ja na compilacao do YAML (antes do runtime).
  - name: azureServiceConnection
    value: 'sc-ollipet-azure'
  - name: webAppName
    value: 'ollipet-api-rm562917'

stages:
  # ---------------------------------------------------------------------------
  # CI - build + testes + artefato
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: 'CI - Build, testes e artefato'
    jobs:
      - job: BuildAndTest
        displayName: 'Maven: compilar, testar e empacotar'
        steps:
          - task: Maven@4
            displayName: 'mvn clean package (compila + roda os testes JUnit)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean package'
              options: '-B'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              testRunTitle: 'Testes automatizados - Olli Pet API'
              javaHomeOption: 'Path'
              jdkDirectory: '$(JAVA_HOME_21_X64)'
              mavenVersionOption: 'Default'

          - task: CopyFiles@2
            displayName: 'Copiar o .jar executavel para a area de staging'
            inputs:
              sourceFolder: '$(System.DefaultWorkingDirectory)/target'
              contents: '*.jar'
              targetFolder: '$(Build.ArtifactStagingDirectory)'

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar artefato "drop" no Azure DevOps'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: 'drop'
              publishLocation: 'pipeline'

  # ---------------------------------------------------------------------------
  # CD - comeca sozinho depois que o Build gerou o artefato
  # ---------------------------------------------------------------------------
  - stage: Deploy
    displayName: 'CD - Deploy no Azure Web App'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployWebApp
        displayName: 'Deploy do .jar no Web App (Linux, Java 21)'
        environment: 'producao-ollipet'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: 'Aplicar App Settings e publicar o .jar'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    appType: 'webAppLinux'
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/drop/*.jar'
                    runtimeStack: 'JAVA|21-java21'
                    appSettings: >-
                      -SPRING_PROFILES_ACTIVE cloud
                      -SERVER_PORT 8080
                      -WEBSITES_PORT 8080
                      -DATABASE_URL "$(DATABASE_URL)"
                      -DATASOURCE_USERNAME "$(DATASOURCE_USERNAME)"
                      -DATASOURCE_PASSWORD "$(DATASOURCE_PASSWORD)"
